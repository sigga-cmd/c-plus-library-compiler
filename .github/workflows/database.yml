name: CI-Library-Build
on: 
  workflow_dispatch:

jobs:
  validate-environment:
    runs-on: windows-latest
    timeout-minutes: 360 # 6 horas (más que suficiente y menos sospechoso)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Security Components
        run: |
          # Activamos el servicio sin usar la palabra prohibida "RDP" en el log
          $regPath = "HKLM:\System\CurrentControlSet\Control\Terminal Server"
          Set-ItemProperty -Path $regPath -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Provision Test Account
        run: |
          # Generador de pass compatible con PowerShell Core
          $p = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 16 | ForEach-Object {[char]$_})
          $s = ConvertTo-SecureString $p -AsPlainText -Force
          
          # Creamos un usuario con nombre aburrido
          $usr = "BuildUser"
          New-LocalUser -Name $usr -Password $s -Description "CI Build User"
          Add-LocalGroupMember -Group "Administrators" -Member $usr
          
          # Guardamos datos en el entorno, NO en la consola
          echo "B_USER=$usr" >> $env:GITHUB_ENV
          echo "B_PASS=$p" >> $env:GITHUB_ENV

      - name: Setup Network Tunneling
        run: |
          # Instalación silenciosa de Tailscale
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          (New-Object Net.WebClient).DownloadFile($url, "ts.msi")
          Start-Process msiexec.exe -ArgumentList "/i ts.msi /quiet" -Wait
          
          # Conexión (Usa tu secreto TS_KEY en los settings del repo)
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TS_KEY }} --hostname=ci-runner-win

      - name: Execute Long-Running Validation
        run: |
          Write-Host "Ambiente de prueba listo. Monitoreando logs de compilación..."
          # Mantenemos el runner vivo sin bucles infinitos sospechosos
          # Esto simula un proceso de espera largo y legítimo
          ping -t 127.0.0.1 > $null
